<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CyberVault — Secure Credential Storage</title>

    <meta name="description" content="A futuristic, developer-focused password vault with military-grade security" />
    <meta name="author" content="CyberVault" />

    <!-- Open Graph -->
    <meta property="og:title" content="CyberVault - Secure Credential Storage" />
    <meta property="og:description" content="A futuristic, developer-focused password vault with military-grade security" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Archivo+Black&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
      :root{
        --bg:#0a0a0a;
        --lime:#c3f53c;
        --blue:#0ab6fb;
      }

      *{ margin:0; padding:0; box-sizing:border-box; }

      body{
        font-family:'Archivo', sans-serif;
        background:#0a0a0a;
        color:#fff;
      }

      /* Loader before React mounts */
      #loader{
        position:fixed;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        gap:1rem;
        background:#0a0a0a;
        z-index:10;
      }

      .logo{
        font-family:'Archivo Black', sans-serif;
        font-style:italic;
        text-transform:uppercase;
        font-size:2.25rem;
        color:var(--lime);
        text-shadow:5px 5px 0 #000;
      }

      .typing{
        font-family:'JetBrains Mono', monospace;
        text-transform:uppercase;
        font-size:.75rem;
        letter-spacing:.2em;
        background:var(--blue);
        color:#0a0a0a;
        border:2px solid #fff;
        box-shadow:4px 4px 0 #000;
        padding:.4rem .8rem;
      }
    </style>

  </head>

  <body>

    <!-- ⚡ Premium Loader -->
    <div id="loader">
      <div class="logo">CyberVault</div>
      <div class="typing">Initializing secure system...</div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide loader after React loads -->
    <script>
      window.addEventListener("load",()=>{
        const loader=document.getElementById("loader");
        if(loader){
          loader.style.opacity="0";
          loader.style.transition="0.6s";
          setTimeout(()=>loader.remove(),600);
        }
      });
    </script>

  </body>
</html>
